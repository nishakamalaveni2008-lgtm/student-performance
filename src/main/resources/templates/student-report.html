<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Report</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-4"><a href="/">← Dashboard</a><div class="card p-4 mt-3"><h3>Student Result Report</h3><p><b>ID:</b> <span th:text="${student.studentId}"></span> · <b>Name:</b> <span th:text="${student.name}"></span></p><p><b>Department:</b> <span th:text="${student.department}"></span> · <b>Year:</b> <span th:text="${student.yearOfStudy}"></span></p>
<table class="table table-bordered"><thead><tr><th>Subject</th><th>Internal</th><th>Exam</th><th>Total</th><th>Average %</th><th>Grade</th><th>Status</th></tr></thead><tbody><tr th:each="m:${marks}"><td th:text="${m.subject.subjectName}"></td><td th:text="${m.internalMarks}"></td><td th:text="${m.examMarks}"></td><td th:text="${m.totalMarks}"></td><td th:text="${m.average}"></td><td th:text="${m.grade}"></td><td th:text="${m.status}"></td></tr></tbody></table></div></main></body></html>
